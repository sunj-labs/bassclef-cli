# tier: upstream
# .github/workflows/lite-adopter-smoke.yml — nightly adopter smoke
# against the lite runtime.
#
# Session A walking skeleton per docs/next-session-plan-2026-10-04-e2e-cascade-drivers.md.
#
# RFC F-JC-1 fold: GHA OS matrix (ubuntu + macOS) for fidelity, not container.
# RFC F-MN-1 fold: writes docs/nightly-status.md so operator reads one file
#   to see which drivers flipped GREEN overnight.
# RFC F-MN-3 fold: hello-probe before matrix; skip + file ticket if claude
#   service degrades or OAuth expires.
# R-T2 fold: continue-on-error for matrix cells; only tag-push run is a
#   hard gate.
# R-B4 fold: exit 3 from a driver counts as expected-RED (not CI failure).
# Finding 3 fold: matrix across last 3 releases catches regression where
#   fix A ships and silently breaks fix B.

name: lite-adopter-smoke

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      smoke_live:
        description: 'Run against real claude (requires OAuth token)'
        required: false
        default: 'true'
        type: boolean
  # cli#340 F-AR-2 — PR trigger lets authors see the workflow run on
  # their PR before merge. paths filter keeps noise out of docs-only
  # PRs. Fork PRs skip secret-dependent steps by default (GHA policy).
  pull_request:
    paths:
      - '.github/workflows/lite-adopter-smoke.yml'
      - 'scripts/tests/smoke-drive-e2e-*.test.sh'
      - 'scripts/tests/smoke-drive-adopter-*.test.sh'
      - 'scripts/tests/smoke-drive-flow-*.sh'
      - 'scripts/tests/claude-chain.test.sh'
      - 'scripts/tests/lib/lite-runtime-invariants.sh'
      - 'scripts/lib/smoke-assert.sh'
      - 'scripts/lib/claude-chain.sh'
      - 'Dockerfile.lite-adopter'
      - 'scripts/tests/run-lite-container.sh'

# F6 fold (pre-mortem R-N3) — cancel superseded runs on force-push so
# authors see one row per PR, not a backlog of outdated runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hello-probe:
    name: hello-probe — fail fast on auth/service degrade
    runs-on: ubuntu-24.04
    outputs:
      claude_ok: ${{ steps.probe.outputs.ok }}
    steps:
      - name: probe
        id: probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no OAuth token; skipping matrix"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "probe skipped — token present (hello-probe inside container deferred to PR 1b driver addition)"

  smoke-matrix:
    name: smoke / ${{ matrix.os }} / cli-ref=${{ matrix.cli_ref }}
    needs: hello-probe
    if: needs.hello-probe.outputs.claude_ok == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        cli_ref: [main, latest-tag, prior-tag]
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.cli_ref == 'main' && 'main' || '' }}
          fetch-depth: 0

      - name: resolve prior tag
        if: matrix.cli_ref != 'main'
        run: |
          if [[ "${{ matrix.cli_ref }}" == "latest-tag" ]]; then
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          fi
          if [[ -n "$TAG" ]]; then
            echo "checking out $TAG"
            git checkout "$TAG"
          fi

      - name: run Tier 0 lite-runtime tests
        # cli#348 fail-safe (Nygard) — old tags predate these test files.
        # Guard each invocation with a presence check; log "SKIP:" + short
        # SHA so operators can grep expected-skip vs real pass. Exit 0 so
        # the matrix cell stays green on expected-skip and stays red only
        # on real test failure.
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          for test in \
            scripts/tests/lite-runtime-invariants.test.sh \
            scripts/tests/smoke-assert-check-artifact-exists.test.sh \
            scripts/tests/claude-chain.test.sh ; do
            if [[ -f "$test" ]]; then
              echo "--- $test ---"
              bash "$test"
            else
              echo "SKIP: $test not present at $SHORT_SHA — tag predates test"
            fi
          done

      - name: run drivers (PR 1b lands these; ADR-011 D4 extends to adopter + flow families)
        run: |
          shopt -s nullglob 2>/dev/null || true
          pass=0
          fail=0
          skip=0
          found=0
          failing=()
          # Three driver families per ADR-011 D4:
          #   - smoke-drive-e2e-*.test.sh      — persona chains (onboard, launch, build)
          #   - smoke-drive-adopter-*.test.sh  — per-cure anchor drivers (ADR-011 D1+D2)
          #   - smoke-drive-flow-*.sh          — adopter command sequences (ADR-011 D3)
          # Exit 77 is SKIP per ADR-011 D2; SKIP does not count as fail.
          for pattern in \
              scripts/tests/smoke-drive-e2e-*.test.sh \
              scripts/tests/smoke-drive-adopter-*.test.sh \
              scripts/tests/smoke-drive-flow-*.sh; do
            for drv in $pattern; do
              found=$((found+1))
              echo "--- $drv ---"
              set +e
              bash "$drv"
              rc=$?
              set -e
              case "$rc" in
                0)  pass=$((pass+1)) ;;
                77) skip=$((skip+1)) ;;
                *)  fail=$((fail+1)); failing+=("$drv (rc=$rc)") ;;
              esac
            done
          done
          echo ""
          echo "==> drivers: $found total / $pass pass / $fail fail / $skip skip"
          if (( fail > 0 )); then
            echo "FAILING DRIVERS (report-only; matrix tests multiple cli refs):"
            for f in "${failing[@]}"; do echo "  $f"; done
          fi
          # Report-only: the matrix tests main + latest-tag + prior-tag.
          # Older cli refs may carry drivers whose cures hadn't landed yet.
          # Operator reads the pass/fail/skip tally; the step does not block
          # merges on legacy fails. For strict-fail signal, see Tier 0
          # vitest + typecheck job which runs against the PR branch directly.
