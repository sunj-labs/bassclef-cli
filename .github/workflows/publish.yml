# Publish pipeline for @thebassclef/lite.
#
# @requirement R-NPM-006
# @requirement R-NPM-011
# @requirement R-NPM-012
#
# Contract: docs/adrs/ADR-004-publish-pipeline-safety-contract.md
# (see Amendment 2026-09-07 — target renamed core → lite per coord #51 Q1).
# Registry: docs/requirements/2026-08-11-npm-distribution.md.
#
# The workflow satisfies three requirements — R-NPM-006 (trusted
# publisher + provenance), R-NPM-011 (first tagged release path), and
# R-NPM-012 (all Tier 0 tests green — enforced by the `npm test` step
# in the checks job, which runs the traceability check at
# tests/requirements-traceability.test.ts alongside the other 16 tests).
#
# WORKFLOW PATH IS SEMVER-LOCKED. Renaming this file requires:
#   1. An ADR amendment (or a superseding ADR).
#   2. An npm trusted-publisher config change at
#      npmjs.com/settings/<user>/packages/@thebassclef/lite.
# A rename PR without the npm-side change breaks publishing silently.
#
# Two-job shape (iteration c per audit finding D-4.1):
#   Job 1: checks — validate tag + build + test + typecheck + andon +
#     tier filter. Runs on every trigger. No approval gate.
#   Job 2: publish — needs: checks. Environment npm-publish gates the
#     job. Approver sees the green check output on the workflow run
#     page BEFORE clicking approve. Rebuilds from source at the tag
#     ref (deterministic given pinned deps) and publishes.
# Before iteration c the single-job shape put the environment gate at
# job level, which meant approval fired before checkout. The approver
# had no check output to look at when clicking approve.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.0.2). Must exist as a git tag."
        required: true
        type: string

permissions:
  # id-token: required for npm provenance attestation via trusted publisher.
  # contents: required for actions/checkout.
  # No packages: write. No contents: write. No pull-requests: write.
  id-token: write
  contents: read

jobs:
  checks:
    name: Pre-publish checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
      prerelease: ${{ steps.resolve-tag.outputs.prerelease }}

    steps:
      - name: Resolve tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          # Fetch full history so the ancestor check in validate-tag works.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install with --ignore-scripts
        # ADR-004 §Ordered steps 3 — blocks arbitrary script execution
        # from any transitive dependency at install time.
        run: npm ci --ignore-scripts

      - name: Validate tag matches package.json + reachable from main
        run: node scripts/validate-tag.mjs "${{ steps.resolve-tag.outputs.tag }}"

      - name: Build
        run: npm run build

      - name: Checkout sibling bassclef at pinned tag (for substrate source)
        # Prepublish reads lite-manifest.json + source files from a
        # checkout of sunj-labs/bassclef (the public downstream —
        # more stable than the R&D upstream). On the CI runner we
        # clone it into $GITHUB_WORKSPACE/bassclef (child path;
        # actions/checkout requires path stays under the workspace)
        # and pass the absolute path via env var to the prepublish
        # script.
        #
        # Requires BASSCLEF_SOURCE_TOKEN secret — a fine-grained
        # PAT with `Contents: Read` on sunj-labs/bassclef (Metadata:
        # Read is auto-included). The repo is private per operator
        # setup.
        #
        # Phase 2 (goal 2026-09-13b): tag pinned to v0.39.0 per
        # bassclef-upstream ADR-055 (accepted 2026-09-13). The pinned
        # tag ships standards/bassclef-wiring-manifest.json schema
        # major 2.x + presence/dist-templates/ which the extended
        # prepublish script reads to build dist/lite/. See ADR-007
        # §Acceptance delta 2026-09-13 for the pivot record.
        #
        # Design note: we source from public bassclef, not
        # bassclef-upstream (R&D), so npm publishes ship the last
        # stable release surface. See ADR-005 §Amendment 2026-08-12
        # + ADR-007 §Amendment 2026-08-30 for the release flow.
        uses: actions/checkout@v4
        with:
          repository: sunj-labs/bassclef
          ref: v0.39.0
          token: ${{ secrets.BASSCLEF_SOURCE_TOKEN }}
          path: bassclef
          fetch-depth: 1

      - name: Assert pinned bassclef tag resolves
        # Nygard N1 pre-mortem catch (goal 2026-09-13b) — verify the
        # checkout landed the expected tag SHA. If the tag disappeared
        # or was force-pushed since pin time, this step fails loud
        # with a specific remediation.
        run: |
          cd bassclef
          RESOLVED_SHA=$(git rev-parse HEAD)
          RESOLVED_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "UNKNOWN")
          echo "Resolved: $RESOLVED_TAG at $RESOLVED_SHA"
          if [ "$RESOLVED_TAG" != "v0.39.0" ]; then
            echo "::error::Expected pinned tag v0.39.0 but checkout resolved to $RESOLVED_TAG. Tag may have moved or been deleted at sunj-labs/bassclef. Update ADR-007 §Acceptance delta + this workflow before re-publish."
            exit 1
          fi

      - name: Bundle dist/lite/ via prepublish script
        # Explicit invocation — the `prepublishOnly` lifecycle hook does
        # NOT fire under `npm publish --ignore-scripts` (npm docs). Runs
        # here as an ordinary node process to populate dist/lite/ before
        # pack + publish see it.
        #
        # Runs BEFORE `npm test` so tests exercise a populated dist/lite/.
        # Per Phase 3 (cli#73), init fails loud with exit 4 when the
        # wiring manifest is missing; tests that dispatch runInit require
        # the bundle to be present.
        #
        # BASSCLEF_SIBLING_ROOT points at the in-workspace clone from
        # the prior step.
        env:
          BASSCLEF_SIBLING_ROOT: ${{ github.workspace }}/bassclef
        run: node scripts/prepublish-bundle-substrate.mjs

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Pack (dry run) to get the exact shipped file list
        run: npm pack --dry-run --json > /tmp/pack.json

      - name: Andon scan for operator-private terms
        run: node scripts/andon-scan.mjs /tmp/pack.json

      - name: Tier filter refuses tier=upstream frontmatter
        run: node scripts/tier-filter.mjs /tmp/pack.json

      - name: Assert dist/lite/ present in tarball
        # Phase 3 (cli#73 MAJOR 1.0.0) — dist/lite/ is the sole bundle
        # path. Expected 6 files: .claude/settings.json + 4 templates
        # + standards/bassclef-wiring-manifest.json.
        #
        # If dist/lite/ is missing OR under-populated, the prepublish
        # script's build path silently skipped OR the build failed
        # (should never reach here — the script fails loud). Exit 1
        # with a specific remediation.
        run: |
          COUNT=$(node -e "
            const p = require('/tmp/pack.json');
            if (!Array.isArray(p) || !p[0] || !Array.isArray(p[0].files)) {
              process.stderr.write('npm pack --json output shape unexpected — expected [{files:[{path}]}], got: ' + JSON.stringify(p).slice(0, 200) + '\n');
              process.exit(2);
            }
            process.stdout.write(String(p[0].files.filter(f => f.path.startsWith('dist/lite/')).length));
          ")
          echo "dist/lite/ file count: $COUNT"
          if [ "$COUNT" -lt 6 ]; then
            echo "::error::dist/lite/ file count $COUNT is under the 6-file floor. Tarball would ship without a complete dist/lite/. Fix: verify the prepublish script's dist/lite/ build fired and copied the wiring manifest into standards/. See docs/adrs/ADR-007-npm-lite-substrate-bundling.md §Amendment 2026-09-13c for the contract."
            exit 1
          fi

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: checks
    environment: npm-publish
    # Job-level re-declaration. Workflow-level permissions at line 45-50 should
    # inherit, but three v0.0.2 attempts hit npm 404 despite matching trusted
    # publisher config. GitHub docs say inheritance works; anecdotal reports in
    # npm/cli say OIDC subject claim carries the environment reliably only when
    # permissions live at job scope. Belt-and-suspenders for the OIDC path.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node 22 with npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publisher support
        # Trusted publishers via OIDC need npm 11.5.1+. The runner's
        # bundled npm may be older. Without this upgrade, the OIDC token
        # mints cleanly (sigstore accepts the signing request) but
        # registry.npmjs.org returns 404 on the PUT because the older
        # CLI does not send the trusted
        # publisher headers. Five v0.0.2 attempts confirmed the pattern.
        #
        # Pinned to npm@11 (not @latest) — known-good since iteration e.
        # npm@11.5.1+ carries the OIDC trusted-publisher headers. Moving
        # to @latest or npm@12 is a separate concern; keep the pin stable
        # across the Node 20 → 22 bump so the Node bump is the only
        # variable in this PR. Run 31687663177 originally forced this
        # pin (EBADENGINE on npm@12.0.2 vs node@v20.20.2 under old Node
        # 20 runner); Node 22 removes that specific constraint but the
        # pin still serves reproducibility.
        run: npm install -g npm@11

      - name: Install with --ignore-scripts
        run: npm ci --ignore-scripts

      - name: Rebuild deterministically at the tag
        # Same source + same install script defaults + same tool versions
        # produce bit-for-bit identical dist/. The rebuild here keeps the
        # publish job self-contained (no artifact sharing with the checks
        # job) at a cost of ~30s of duplicated work.
        run: npm run build

      - name: Checkout sibling bassclef at pinned tag (for substrate source)
        # Sibling clone required for the prepublish script per issue
        # #40 cure. Requires BASSCLEF_SOURCE_TOKEN secret (same as
        # checks job). Source is sunj-labs/bassclef (public downstream)
        # so publishes ship the stable release surface, not R&D upstream.
        #
        # Phase 2 (goal 2026-09-13b): tag pinned to v0.39.0 per
        # bassclef-upstream ADR-055 (accepted 2026-09-13). Matches the
        # checks job's pin so both jobs bundle the same source revision.
        uses: actions/checkout@v4
        with:
          repository: sunj-labs/bassclef
          ref: v0.39.0
          token: ${{ secrets.BASSCLEF_SOURCE_TOKEN }}
          path: bassclef
          fetch-depth: 1

      - name: Bundle substrate via prepublish script
        # Explicit invocation before `npm publish --ignore-scripts`. Per
        # #40 diagnose — `--ignore-scripts` blocks the prepublishOnly
        # lifecycle hook, so the bundling must run as a plain workflow
        # step here. ADR-007 §D3 amendment records this.
        #
        # BASSCLEF_SIBLING_ROOT points at the in-workspace clone.
        env:
          BASSCLEF_SIBLING_ROOT: ${{ github.workspace }}/bassclef
        run: node scripts/prepublish-bundle-substrate.mjs

      - name: Publish to npm
        # ADR-004 §Ordered steps 12:
        #   --provenance    generates the attestation from the OIDC token
        #   --ignore-scripts  belt-and-suspenders on top of ADR-001's
        #                     no-prepublishOnly + no-postinstall discipline
        # Trusted publisher config on npmjs.com replaces NPM_TOKEN entirely.
        run: |
          if [ "${{ needs.checks.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --ignore-scripts --tag next
          else
            npm publish --provenance --ignore-scripts --tag latest
          fi

      - name: Post-publish confirmation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## Published"
            echo ""
            echo "- Package: https://www.npmjs.com/package/@thebassclef/lite/v/$VERSION"
            echo "- Provenance: https://www.npmjs.com/package/@thebassclef/lite/v/$VERSION#provenance"
          } >> "$GITHUB_STEP_SUMMARY"
