# PR-CI check surface for @thebassclef/lite.
#
# @requirement R-NPM-007 (extension per Epic #194 Stories 1-3)
#
# Fires on every pull_request. Runs the Tier 0 test suite + typecheck.
# The version-sync assertion rides inside `npm test` — see
# tests/version-sync.test.ts + tests/version-set-check.test.ts.
#
# Scope discipline per RFC F2 (Brooks · conceptual integrity):
#   PR time: build + `npm test` + `npm run typecheck`.
#   Release time (publish.yml): PR-time checks + tag validation +
#   pack + andon scan + tier filter + npm publish.
# Running the full release checks on every PR would waste ~5min per
# PR — the tag does not exist yet.
#
# Bundling: mirrors publish.yml's install-build-bundle-test order.
# `dist/lite/` must be populated before `npm test` fires because
# init tests dispatch runInit which reads the bundled manifest per
# ADR-055 D1. Without the bundle step, 70+ tests fail with
# ManifestMissing (exit code 4).
#
# Sibling pin at v1.1.1 matches publish.yml. Ticket #193 will unify
# the four Node pins + `ubuntu-latest` migration across every
# workflow in one PR later.
#
# No `paths:` filter — fires on every PR. A hand-edit of
# `src/index.ts` alone (no `.github/**` touched) still trips this
# check when it desyncs from package.json + README + CHANGELOG.
# Per pre-mortem R3 (Nygard · path-filter miss) at
# docs/risk-ledgers/2026-09-21-pre-tag-version-sync.md.

name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test + typecheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install with --ignore-scripts
        # Match publish.yml discipline per ADR-004 §Ordered steps 3.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Read .bassclef-pin
        # cli#482. This step did not exist, and the checkout below
        # hardcoded `ref: v1.1.1` while .bassclef-pin named v1.11.1 --
        # a different tag, 27 days older. The comment said "matches
        # publish.yml pin" and it did not. So the full suite validated a
        # bundle built from one substrate version while publish shipped
        # another. scripts/tests/bassclef-pin.test.sh only read
        # publish.yml, which is why nothing caught it.
        run: |
          PIN=$(tr -d '[:space:]' < .bassclef-pin)
          echo "BASSCLEF_PIN=$PIN" >> "$GITHUB_ENV"
          echo "Pin: $PIN"

      - name: Checkout sibling bassclef at pinned tag (for substrate source)
        # Matches publish.yml pin. See ADR-007 §Amendment 2026-09-13c
        # for the source-of-truth policy. Bundling needs a checkout of
        # sunj-labs/bassclef to read the wiring manifest + presence
        # dist-templates + source graph closure.
        uses: actions/checkout@v5
        with:
          repository: sunj-labs/bassclef
          ref: ${{ env.BASSCLEF_PIN }}
          token: ${{ secrets.BASSCLEF_SOURCE_TOKEN }}
          path: bassclef
          fetch-depth: 1

      - name: Bundle dist/lite/ via prepublish script
        # Init tests dispatch runInit which reads dist/lite/ per
        # ADR-055 D1. Without this step, 70+ tests fail with
        # ManifestMissing (exit 4).
        env:
          BASSCLEF_SIBLING_ROOT: ${{ github.workspace }}/bassclef
        run: node scripts/prepublish-bundle-substrate.mjs

      - name: Test
        # Full vitest suite — 458 tests as of 2026-09-21.
        # Includes:
        # - tests/version-sync.test.ts (real files agree at HEAD)
        # - tests/version-set-check.test.ts (12 pure-function tests)
        # - tests/check-version-set.integration.test.ts (spawn-based)
        # - 53 other test files covering init + sync + walker + harness
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  validate-cross-repo-contracts:
    # Per ADR-059 step 4 (cli#415). Mirrors upstream's
    # `.github/workflows/bassclef-pr-ci.yml` L437-464 — the dual-fire
    # gate for the install-written-paths contract. Fails loud on drift
    # at either the registry shape, the schema_ref file presence, the
    # ajv compile, or the test_refs path presence.
    name: Validate cross-repo contracts (ADR-059)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v5

      - name: Setup Node 22 (for ajv-cli)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install ajv-cli + ajv-formats
        run: npm install -g ajv-cli ajv-formats

      - name: Verify jq present
        run: command -v jq

      - name: Run cross-repo contracts validator
        run: bash scripts/validate-cross-repo-contracts.sh --strict

      - name: Run Tier 0 characterization tests
        run: bash scripts/tests/validate-cross-repo-contracts.test.sh

      - name: Run every bash Tier 0 suite
        # The step above ran one suite out of eighteen. scripts/tests/ holds
        # 87 files; 69 are smoke drivers that belong to docker-smoke.yml, and
        # the remaining 18 are plain unit suites that need nothing but bash
        # and jq. Seventeen of those have never run in CI, so every assertion
        # in them -- including the ones guarding the publish gate and the
        # substrate pin -- was enforced on a developer's machine and nowhere
        # else. Measured 2026-11-08: all 18 pass locally.
        #
        # Smoke drivers stay out on purpose. Several are written to exit
        # nonzero while the defect they characterize is open, so running them
        # here would report an open ticket as a broken build.
        #
        # Three of the 18 are held out by name, each for a reason measured on
        # run 42486577753 rather than guessed. All three pass on macOS and
        # fail on the runner, which is the defect, not the exclusion. Filed
        # so they come back:
        #
        #   smoke-expect           expect(1) is not installed on the runner.
        #                          The suite fails rather than skipping, and
        #                          leaks `SMOKE_EXPECT_VERSION: readonly`.
        #   sync-bassclef-version  T1-T5 pass; T6 needs a checkout of the
        #                          public sibling, which a runner has no
        #                          reason to hold. Fails rather than skipping.
        #   refresh-oauth-token    31 of 32 pass. T07 reads a file mode with
        #                          macOS `stat` syntax; on Linux the same
        #                          call prints a filesystem dump, so the
        #                          comparison fails while the mode is in fact
        #                          600. A portability bug in the test.
        run: |
          failed=""
          total=0
          held_out="smoke-expect.test.sh sync-bassclef-version.test.sh refresh-oauth-token.test.sh"
          for t in scripts/tests/*.test.sh; do
            case "$(basename "$t")" in smoke-drive-*) continue ;; esac
            case " $held_out " in *" $(basename "$t") "*) echo "HELD OUT $(basename "$t") — see the comment above"; continue ;; esac
            total=$((total + 1))
            echo "::group::$(basename "$t")"
            if bash "$t"; then
              echo "PASS $(basename "$t")"
            else
              failed="$failed $(basename "$t")"
              echo "FAIL $(basename "$t")"
            fi
            echo "::endgroup::"
          done
          echo "ran $total bash Tier 0 suite(s)"
          if [ -n "$failed" ]; then
            echo "failing suites:$failed" >&2
            exit 1
          fi
