# tier: standard
# Docker cold-adopter smoke — Linux CI complement to macOS OrbStack local runs.
# Per cli#162 V1 walking skeleton.
#
# Refs:
#   - docs/iteration-bets/2026-09-20b-docker-cold-adopter-harness.md
#   - docs/runbook/docker-smoke.md (local operator counterpart)
#
# Contract stability (RFC-0001 R1 cure): invocation shape frozen per ADR-031.
# Anticorruption layer (RFC-0002 R9 cure): only CLI_VERSION + auth token(s) cross into the container.
# Per #184: pass BOTH ANTHROPIC_API_KEY + CLAUDE_CODE_OAUTH_TOKEN when configured.
# Harness prefers OAuth when both are present so runs bill against subscription, not metered API.

name: docker-smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'harness/**'
      - 'scripts/smoke-*.sh'
      - 'scripts/lib/smoke-*.sh'
      - 'scripts/lib/smoke-drive-*.sh'
      - 'scripts/lib/persona-assert.sh'
      - 'scripts/tests/smoke-drive-e2e-*.sh'
      - 'scripts/tests/fixtures/sam-onboard-repo/**'
      - 'scripts/tests/fixtures/louis-whereami/**'
      - '.github/workflows/docker-smoke.yml'
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Target @thebassclef/lite version (e.g. 1.2.1, 1.2.2, latest)'
        required: false
        default: 'latest'

# CT2 fold (pre-mortem cli#254 CI token wire): narrow default GITHUB_TOKEN.
# The elevated SMOKE_GH_TOKEN (repo Actions secret) is the only write path
# for the V2i interactive step's cross-repo gh calls.
permissions:
  contents: read
  actions: read

jobs:
  docker-cold-adopter-smoke:
    name: Docker cold-adopter smoke (linux/amd64)
    runs-on: ubuntu-latest
    # cli#254 V2i wall-clock margin. Was 15; V2 already takes ~7 min,
    # V2i adds another 4-5 min at the tightened 90s per-drive timeout.
    # 20 min gives headroom for cold-cache network + real Claude latency.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cold-adopter image
        run: |
          docker build \
            --platform=linux/amd64 \
            -t bassclef-cli-cold-adopter:pr \
            -f harness/docker/Dockerfile.cold-adopter \
            .

      - name: Run cold-adopter smoke
        id: smoke
        continue-on-error: true
        env:
          CLI_VERSION: ${{ github.event.inputs.cli_version || 'latest' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # cli#254 CI token wire — SMOKE_GH_TOKEN routes V2i /promote-style
          # ticket creates at the sandbox repo. GH_SMOKE_REPO pins the target.
          # If SMOKE_GH_TOKEN is unset (fork PR or first-run before secret
          # lands), the in-container V2i step skips Class 3 skills per its
          # own fail-soft logic. Walking-skeleton drives run either way.
          SMOKE_GH_TOKEN: ${{ secrets.SMOKE_GH_TOKEN }}
          GH_SMOKE_REPO: sunj-labs/bassclef-cli-smoke
        run: |
          # Anticorruption layer — pass ONLY the documented env vars.
          # Never use bare --env; never pass the full runner env into the container.
          # Per #184: pass both auth tokens. Harness's preflight_v2 prefers OAuth
          # (subscription) when both are set so runs don't bill metered API.
          # Per cli#254 CI token wire: pass GH_TOKEN + GH_SMOKE_REPO for V2i step.
          #
          # Bind-mount for capture extraction (cli #221 cure):
          # Container writes drive captures at /adopter/state/harness-runs/<ts>/.
          # Runner mounts $GITHUB_WORKSPACE/harness-out to that path so captures
          # land on the runner filesystem. chmod 777 covers uid mismatch between
          # container `adopter` and runner `runner`. The next step uploads them.
          mkdir -p "$GITHUB_WORKSPACE/harness-out"
          chmod 777 "$GITHUB_WORKSPACE/harness-out"
          set +e
          # CT1 fold: never echo $SMOKE_GH_TOKEN. GitHub masks it via secrets.
          # context. Passing via -e keeps it out of the command string.
          docker run \
            --rm \
            --platform=linux/amd64 \
            -e CLI_VERSION="$CLI_VERSION" \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            -e GH_TOKEN="$SMOKE_GH_TOKEN" \
            -e GH_SMOKE_REPO="$GH_SMOKE_REPO" \
            -v "$GITHUB_WORKSPACE/harness-out":/adopter/state/harness-runs \
            bassclef-cli-cold-adopter:pr
          EXIT_CODE=$?
          echo "smoke_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Upload smoke captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-captures-${{ github.run_id }}
          path: harness-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Report smoke result
        if: always()
        run: |
          CODE="${{ steps.smoke.outputs.smoke_exit_code }}"
          echo "## Docker smoke result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- CLI version: \`${{ github.event.inputs.cli_version || 'latest' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: \`$CODE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          case "$CODE" in
            0)  echo "PASS — cli self-contained." >> "$GITHUB_STEP_SUMMARY" ;;
            3)  echo "DETECT — hooks wired but missing (bassclef-upstream#1827 class). Falsification-test success on 1.2.1." >> "$GITHUB_STEP_SUMMARY" ;;
            4)  echo "DETECT — skill hardcoded operator paths (bassclef-upstream#1824 class)." >> "$GITHUB_STEP_SUMMARY" ;;
            5)  echo "DETECT — skill drive timeout." >> "$GITHUB_STEP_SUMMARY" ;;
            20) echo "INFRA FAIL — Docker build failed after retries (EXIT_BUILD_FAIL). Check base image + apt sources." >> "$GITHUB_STEP_SUMMARY" ;;
            21) echo "INFRA FAIL — npm install -g @thebassclef/lite failed after 3 retries (EXIT_INSTALL_FAIL). Likely tarball CDN lag right after publish OR network. Wait 5-10 min post-publish before re-running." >> "$GITHUB_STEP_SUMMARY" ;;
            22) echo "INFRA FAIL — target CLI_VERSION not on npm registry (EXIT_VERSION_NOT_FOUND). Confirm the version is published: npm view @thebassclef/lite@\$CLI_VERSION" >> "$GITHUB_STEP_SUMMARY" ;;
            23) echo "INFRA FAIL — bassclef init failed inside container (EXIT_INIT_FAIL). Check container logs for init stderr." >> "$GITHUB_STEP_SUMMARY" ;;
            25) echo "PREFLIGHT FAIL — neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN set (V2 skill drive only)." >> "$GITHUB_STEP_SUMMARY" ;;
            30) echo "INTERACTIVE — expect script bug (cli#254 V2i). Check drive log at harness-out/**/interactive/*.log." >> "$GITHUB_STEP_SUMMARY" ;;
            31) echo "INTERACTIVE — expect timeout waiting for pattern. May need bump via SMOKE_INTERACTIVE_DRIVE_TIMEOUT." >> "$GITHUB_STEP_SUMMARY" ;;
            33) echo "INTERACTIVE — missing prereq (expect binary or spawn cmd). Rebuild Docker image; verify expect installed." >> "$GITHUB_STEP_SUMMARY" ;;
            34) echo "INTERACTIVE — teardown fail (ticket close). The 6-hour stale-close workflow on bassclef-cli-smoke closes leftover tickets." >> "$GITHUB_STEP_SUMMARY" ;;
            *)  echo "See exit-codes.sh vocabulary for code $CODE." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Fail job on non-detect codes
        if: always()
        run: |
          CODE="${{ steps.smoke.outputs.smoke_exit_code }}"
          # Detection codes (0, 3, 4, 5) are expected + acceptable.
          # Interactive codes (30-34) are ADVISORY — V2i needs a real
          # ~/.claude/.credentials.json seeded via `claude setup-token`
          # before it can complete drives. Followed at cli#276. Until
          # then, V2i regressions surface in the run summary but do NOT
          # fail the job. Matches the V2 headless pattern's advisory
          # shape for auth-adjacent gates.
          # Infrastructure failures (20, 21, 22, 23, 24, 26) fail the job.
          # Unknown (99) also fails.
          case "$CODE" in
            0|3|4|5)
              echo "Smoke exit $CODE is expected class; job passes."
              exit 0
              ;;
            30|31|32|33|34)
              echo "Smoke exit $CODE is V2i advisory class (cli#276); job passes with note."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**Note:** V2i lane advisory — see cli#276 for the credentials seed requirement." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "Smoke exit $CODE is failure class (infrastructure); job fails."
              exit 1
              ;;
          esac
